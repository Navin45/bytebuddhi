name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # ── 1. Validate tag ──────────────────────────────────────────────
  preflight:
    if: github.repository == 'Navin45/bytebuddhi' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Extract and verify version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          uv sync --frozen --extra dev
          python scripts/sync_version.py --check-tag "v${TAG}"

  # ── 2. Backend integration tests (PostgreSQL + Redis) ───────────
  integration:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: bytebuddhi
      POSTGRES_DB: bytebuddhi
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || github.run_id }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytebuddhi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev

      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}"
          uv run alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: "postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}"
          BYTEBUDDHI_TEST_DATABASE_URL: "postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}"
          REDIS_URL: "redis://localhost:6379/0"
          BYTEBUDDHI_TEST_REDIS_URL: "redis://localhost:6379/0"
          BYTEBUDDHI_REDIS_COORDINATION: "true"
          BYTEBUDDHI_REQUIRE_DISTRIBUTED: "1"
        run: uv run pytest tests/ -v --tb=short -m "not live_llm and not playwright_browser"

  # ── 3. Security suite ──────────────────────────────────────────
  security:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev --extra web-render
      - run: uv run playwright install --with-deps chromium
      - name: Browser security suite
        env:
          BYTEBUDDHI_REQUIRE_PLAYWRIGHT: "1"
        run: uv run pytest tests/integration/web/test_playwright_browser_security.py -v

  # ── 4. Dependency audit ─────────────────────────────────────────
  audit:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Python dependency audit
        run: uv run pip audit --desc || echo "Advisory-only audit"

  # ── 5. Python release ──────────────────────────────────────────
  python:
    needs: [preflight, integration, security]
    uses: ./.github/workflows/release-python.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  # ── 6. Desktop release ─────────────────────────────────────────
  desktop:
    needs: [preflight, integration]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  # ── 7. Assemble GitHub Release ─────────────────────────────────
  publish:
    needs: [preflight, python, desktop, audit]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts/ -type f \( \
            -name "*.whl" -o -name "*.tar.gz" -o -name "*.exe" \
            -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \
            -o -name "*.deb" -o -name "*.yml" -o -name "*.yaml" \
            -o -name "*.blockmap" -o -name "*.cdx.json" \
          \) -exec cp {} release-files/ \;

      - name: Require complete artifact set
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          missing=0
          require() {
            local pattern="$1"
            local label="$2"
            if ! compgen -G "$pattern" > /dev/null; then
              echo "RELEASE BLOCKED: missing ${label}"
              missing=1
            fi
          }
          require '*.whl' 'Python wheel'
          require '*.tar.gz' 'Python sdist'
          require '*.AppImage' 'Linux AppImage'
          require '*.deb' 'Linux package'
          require '*.cdx.json' 'SBOM'
          if compgen -G '*.exe' > /dev/null || compgen -G '*.dmg' > /dev/null; then
            echo "RELEASE BLOCKED: Windows and macOS installers are frozen and must not be published."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Partial release refused."
            exit 1
          fi

      - name: Generate consolidated checksums
        run: python scripts/generate_checksums.py release-files/ --output release-files/SHA256SUMS

      - name: Generate release manifest
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          COMMIT="${{ github.sha }}"
          # PEP 440 drops the hyphen in pre-releases: 0.1.4-rc.1 -> 0.1.4rc1.
          WHEEL_VERSION=$(printf '%s' "$VERSION" | sed -E 's/-rc\./rc/; s/-a\./a/; s/-b\./b/')
          WHEEL="bytebuddhi-${WHEEL_VERSION}-py3-none-any.whl"
          WHEEL_SHA=$(grep "$WHEEL" release-files/SHA256SUMS | awk '{print $1}')
          if [ -z "$WHEEL_SHA" ]; then
            echo "RELEASE BLOCKED: checksum missing for ${WHEEL}"
            exit 1
          fi
          WHEEL_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${WHEEL}"
          python scripts/release_manifest.py \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --channel "${{ needs.preflight.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}" \
            --artifact "python_wheel:${WHEEL}:${WHEEL_SHA}:${WHEEL_URL}" \
            --output release-files/release.json

      - name: Copy installer scripts
        run: |
          cp scripts/install.sh release-files/install.sh
          cp scripts/install.ps1 release-files/install.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.preflight.outputs.version }}"
          name: "ByteBuddhi v${{ needs.preflight.outputs.version }}"
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
