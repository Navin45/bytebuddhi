[project]
name = "bytebuddhi"
version = "0.1.4-rc.1"
description = "AI-powered coding assistant and agent platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "alembic>=1.18.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.128.0",
    "hiredis>=3.3.0",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "redis>=7.1.0",
    "sqlalchemy[mypy]>=2.0.46",
    "sse-starlette>=3.2.0",
    "uvicorn[standard]>=0.40.0",
    "python-dotenv>=1.2.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "httpx>=0.28.1",
    "google-auth>=2.41.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "gitpython>=3.1.46",
    "tiktoken>=0.12.0",
    "numpy>=2.4.1",
    "openai>=2.15.0",
    "anthropic>=0.76.0",
    "python-dateutil>=2.9.0.post0",
    "orjson>=3.11.5",
    "watchdog>=6.0.0",
    "greenlet>=3.3.1",
    "aiofiles>=25.1.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "mcp>=2.2.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "gunicorn>=26.2.0",
    "websockets>=16.1.1",
    "textual>=8.2.8,<9",
]

[project.scripts]
bytebuddhi = "app.interfaces.cli.main:main"

[project.urls]
Repository = "https://github.com/Navin45/bytebuddhi"
Documentation = "https://github.com/Navin45/bytebuddhi/tree/main/docs"
Issues = "https://github.com/Navin45/bytebuddhi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app/", "alembic/", "alembic.ini", "scripts/", "README.md", "pyproject.toml"]

[project.optional-dependencies]
web-render = [
    "playwright>=1.49.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
    "mypy>=1.19.1",
    "types-redis>=4.6.0.20241004",
    "types-passlib>=1.7.7.20250602",
    "ipython>=9.9.0",
    "ipdb>=0.13.13",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "RUF013", "UP046", "RUF022", "E712", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "playwright_browser: real Chromium Playwright tests (requires playwright extra and installed Chromium)",
    "live_llm: live provider smoke (opt-in; requires LIVE_LLM_PROVIDER and provider API key)",
]
